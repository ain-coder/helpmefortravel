```html id="v7m2q9"
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Platform PRO</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0f14;
  color:white;
}

.wrapper{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:#111827;
  padding:25px;
  border-right:1px solid #1f2937;
}

.logo{
  font-size:28px;
  font-weight:bold;
  margin-bottom:40px;
  color:#ffd600;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.menu button{
  background:#1f2937;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  transition:0.3s;
}

.menu button:hover{
  background:#ffd600;
  color:black;
}

/* MAIN */

.main{
  flex:1;
  padding:30px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.search{
  width:300px;
}

.search input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#1f2937;
  color:white;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-bottom:30px;
}

.stat{
  background:#111827;
  padding:25px;
  border-radius:20px;
}

.stat h2{
  color:#ffd600;
  margin-bottom:10px;
  font-size:32px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.filters select,
.filters input{
  padding:14px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:white;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:20px;
}

.card{
  background:#111827;
  border-radius:20px;
  overflow:hidden;
  transition:0.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 30px rgba(255,214,0,0.12);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.content{
  padding:20px;
}

.badge{
  display:inline-block;
  background:#ffd600;
  color:black;
  padding:6px 12px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:10px;
}

.hot{
  background:#ff3d00;
  color:white;
}

.price{
  font-size:34px;
  color:#00e676;
  margin:15px 0;
  font-weight:bold;
}

.old-price{
  text-decoration:line-through;
  opacity:0.6;
}

.favorite{
  position:absolute;
  top:15px;
  right:15px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:white;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
}

.ai-box{
  background:#111827;
  padding:25px;
  border-radius:20px;
  margin-bottom:30px;
}

.ai-box h3{
  margin-bottom:15px;
  color:#ffd600;
}

.ai-result{
  margin-top:10px;
  line-height:1.6;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
  background:#111827;
  border-radius:20px;
  overflow:hidden;
}

th,td{
  padding:14px;
  border:1px solid #1f2937;
}

th{
  background:#ffd600;
  color:black;
}

.youtube{
  display:inline-block;
  margin-top:15px;
  color:#ff5252;
  text-decoration:none;
}

@media(max-width:1100px){

  .wrapper{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="wrapper">

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    ✈ Travel PRO
  </div>

  <div class="menu">
    <button>Dashboard</button>
    <button>Горящие туры</button>
    <button>Избранное</button>
    <button>Лучшие цены</button>
    <button>Luxury</button>
  </div>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

  <h1>AI Travel Dashboard</h1>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Поиск..."
      oninput="renderTours()"
    >
  </div>

</div>

<!-- STATS -->

<div class="stats">

  <div class="stat">
    <h2 id="totalTours">0</h2>
    <p>Туров найдено</p>
  </div>

  <div class="stat">
    <h2 id="minPrice">$0</h2>
    <p>Минимальная цена</p>
  </div>

  <div class="stat">
    <h2 id="favoritesCount">0</h2>
    <p>Избранное</p>
  </div>

  <div class="stat">
    <h2 id="bestDiscount">0%</h2>
    <p>Макс. скидка</p>
  </div>

</div>

<!-- AI -->

<div class="ai-box">

  <h3>🤖 AI рекомендации</h3>

  <div class="ai-result" id="aiResult">
    Лучший бюджетный тур будет показан здесь.
  </div>

</div>

<!-- FILTERS -->

<div class="filters">

<select id="country" onchange="renderTours()">
  <option value="">Все страны</option>
  <option>Турция</option>
  <option>Египет</option>
  <option>Таиланд</option>
  <option>ОАЭ</option>
</select>

<select id="type" onchange="renderTours()">
  <option value="">Тип отдыха</option>
  <option>Пляжный</option>
  <option>Luxury</option>
  <option>Семейный</option>
</select>

<input
  type="number"
  id="budget"
  placeholder="Макс. бюджет"
  oninput="renderTours()"
/>

<select id="sort" onchange="renderTours()">
  <option value="low">Цена ↑</option>
  <option value="high">Цена ↓</option>
</select>

</div>

<!-- CARDS -->

<div class="cards" id="cards"></div>

<!-- TABLE -->

<table>

<thead>
<tr>
<th>Отель</th>
<th>Страна</th>
<th>Цена</th>
<th>Скидка</th>
<th>Рейтинг</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<script>

const tours = [

{
id:1,
hotel:"Rixos Premium",
country:"Турция",
city:"Анталья",
type:"Luxury",
price:650,
oldPrice:950,
rating:9.6,
discount:35,
image:"https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1200&auto=format&fit=crop",
youtube:"https://youtube.com/results?search_query=Rixos+Antalya"
},

{
id:2,
hotel:"Hilton Resort",
country:"Египет",
city:"Шарм-эль-Шейх",
type:"Пляжный",
price:520,
oldPrice:780,
rating:9.2,
discount:28,
image:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?q=80&w=1200&auto=format&fit=crop",
youtube:"https://youtube.com/results?search_query=Hilton+Egypt"
},

{
id:3,
hotel:"Centara Grand",
country:"Таиланд",
city:"Пхукет",
type:"Семейный",
price:710,
oldPrice:990,
rating:9.4,
discount:30,
image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop",
youtube:"https://youtube.com/results?search_query=Centara+Phuket"
},

{
id:4,
hotel:"Atlantis The Palm",
country:"ОАЭ",
city:"Дубай",
type:"Luxury",
price:1150,
oldPrice:1600,
rating:9.8,
discount:32,
image:"https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1200&auto=format&fit=crop",
youtube:"https://youtube.com/results?search_query=Atlantis+Dubai"
}

];

let favorites =
JSON.parse(localStorage.getItem("favorites")) || [];

function toggleFavorite(id){

if(favorites.includes(id)){
favorites = favorites.filter(f=>f!==id);
}else{
favorites.push(id);
}

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

renderTours();

}

function renderTours(){

const search =
document.getElementById("search")
.value.toLowerCase();

const country =
document.getElementById("country").value;

const type =
document.getElementById("type").value;

const budget =
Number(document.getElementById("budget").value);

const sort =
document.getElementById("sort").value;

let filtered = tours.filter(tour=>{

const searchMatch =
tour.hotel.toLowerCase().includes(search) ||
tour.city.toLowerCase().includes(search);

const countryMatch =
!country || tour.country===country;

const typeMatch =
!type || tour.type===type;

const budgetMatch =
!budget || tour.price<=budget;

return searchMatch &&
countryMatch &&
typeMatch &&
budgetMatch;

});

filtered.sort((a,b)=>{

if(sort==="low"){
return a.price-b.price;
}else{
return b.price-a.price;
}

});

renderCards(filtered);

renderTable(filtered);

updateStats(filtered);

renderAI(filtered);

}

function renderCards(data){

const cards =
document.getElementById("cards");

if(data.length===0){

cards.innerHTML=`
<div class="card">
<div class="content">
<h2>Туры не найдены</h2>
</div>
</div>
`;

return;

}

cards.innerHTML =
data.map((tour,index)=>`

<div class="card">

${index===0
? `<div class="badge hot">
Лучшее предложение
</div>`
: ""
}

<div
class="favorite"
onclick="toggleFavorite(${tour.id})"
>
${favorites.includes(tour.id)
? "❤️"
: "🤍"}
</div>

<img src="${tour.image}">

<div class="content">

<div class="badge">
${tour.country}
</div>

<h2>${tour.hotel}</h2>

<p>📍 ${tour.city}</p>

<p>⭐ ${tour.rating}</p>

<p>🏖 ${tour.type}</p>

<div class="price">
$${tour.price}
</div>

<div class="old-price">
Было: $${tour.oldPrice}
</div>

<p style="margin-top:10px;">
🔥 Скидка ${tour.discount}%
</p>

<a
class="youtube"
href="${tour.youtube}"
target="_blank"
>
▶ Смотреть отель
</a>

</div>

</div>

`).join("");

}

function renderTable(data){

document.getElementById("tableBody")
.innerHTML =
data.map(t=>`
<tr>
<td>${t.hotel}</td>
<td>${t.country}</td>
<td>$${t.price}</td>
<td>${t.discount}%</td>
<td>${t.rating}</td>
</tr>
`).join("");

}

function updateStats(data){

document.getElementById("totalTours")
.innerText=data.length;

const min =
data.length
? Math.min(...data.map(t=>t.price))
: 0;

document.getElementById("minPrice")
.innerText="$"+min;

document.getElementById("favoritesCount")
.innerText=favorites.length;

const maxDiscount =
data.length
? Math.max(...data.map(t=>t.discount))
: 0;

document.getElementById("bestDiscount")
.innerText=maxDiscount+"%";

}

function renderAI(data){

const ai =
document.getElementById("aiResult");

if(data.length===0){

ai.innerHTML =
"Нет рекомендаций.";

return;

}

const best = data[0];

ai.innerHTML = `
✅ Лучший бюджетный вариант сейчас:
<b>${best.hotel}</b> (${best.country})

💰 Цена: <b>$${best.price}</b>

🔥 Скидка: <b>${best.discount}%</b>

⭐ Рейтинг: <b>${best.rating}</b>

🏖 Тип отдыха: <b>${best.type}</b>
`;

}

renderTours();

</script>

</body>
</html>
```
